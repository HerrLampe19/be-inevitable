<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BE INEVITABLE">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<!-- Die ?v=-Tokens werden beim Ausliefern vom Server durch die Version aus package.json ersetzt (Cache-Buster) -->
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=__APP_VERSION__">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=__APP_VERSION__">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=__APP_VERSION__">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=__APP_VERSION__">
<title>BE INEVITABLE</title>
<!-- Design-System (Tokens, Komponenten, Shell) – alles CSS liegt in app.css, index.html enthält nur Markup -->
<link rel="stylesheet" href="/app.css?v=__APP_VERSION__">
<link rel="stylesheet" href="/mindset.css?v=__APP_VERSION__">
<!-- Bereichs-Stylesheets (Stage 2, je ein Besitzer) -->
<link rel="stylesheet" href="/css/home.css?v=__APP_VERSION__">
<link rel="stylesheet" href="/css/training.css?v=__APP_VERSION__">
<link rel="stylesheet" href="/css/diet.css?v=__APP_VERSION__">
<link rel="stylesheet" href="/css/analysis.css?v=__APP_VERSION__">
<link rel="stylesheet" href="/css/coach.css?v=__APP_VERSION__">
<link rel="stylesheet" href="/css/account.css?v=__APP_VERSION__">
</head>
<body>
<div id="loginView" class="login">
  <div class="login-brand">
    <div class="logo-wrap"><img src="/logo.jpg" alt="BE INEVITABLE" class="logo-img"></div>
    <h1>Werde unaufhaltbar.</h1>
    <p>Training, Ernährung &amp; Coaching in einem.</p>
  </div>
  <form class="card" id="authForm" onsubmit="doAuth();return false" novalidate>
    <div id="authErr" class="err hidden"></div>
    <div id="regName" class="field hidden"><label>Name</label><input id="i_name" name="name" autocomplete="name" placeholder="Dein Name" maxlength="80"></div>
    
    <div class="field"><label>E-Mail</label><input id="i_email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="du@mail.com"></div>
    <div class="field"><label>Passwort</label><input id="i_pw" name="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="authBtn" type="submit">Anmelden</button>
    <div class="switch" id="switchLink">Noch kein Konto? <a onclick="toggleAuth()">Registrieren</a></div>
    <div class="switch" id="forgotLink" style="margin-top:8px"><a onclick="openForgot()">Passwort vergessen?</a></div>
    <div id="loginVersion" style="text-align:center;color:var(--ink3);font-size:11px;margin-top:24px"></div>
  </form>
</div>

<div id="onbView" class="login hidden" style="max-width:480px"></div>

<div id="appView" class="app hidden">
  <div class="hdr">
    <div class="title"><span id="hdrTitle">Home</span></div>
    <div class="acts">
      <button class="bell" id="bellBtn" aria-label="Nachrichten" onclick="openMessages()"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="badge hidden" id="bellBadge"></span></button>
      <button class="avatar" id="avatar" aria-label="Profil" onclick="openProfile()">M</button>
    </div>
  </div>
  <div id="ctxBar" class="ctx-bar"></div>
  <div id="views"></div>
  <div class="nav" id="navBar"></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<!-- Pausen-Timer / Trainings-Leiste über der Nav (Logik: training.js; Slot #trainBarSlot für Hantelrechner/Abschließen) -->
<div id="restBar" class="restbar hidden">
  <div class="rest-prog" aria-hidden="true"><i id="restProg"></i></div>
  <button class="rest-time" id="restTimeBtn" aria-label="Pausenlänge wählen" onclick="restPick()"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="14" r="7"/><path d="M12 10v4l2 2M10 2h4M12 2v5M18 8l1.5-1.5"/></svg><span class="num" id="restTime">1:30</span></button>
  <button class="btn sm sec" id="restSub15" aria-label="15 Sekunden kürzer" onclick="restAdd(-15)">−15</button>
  <button class="btn sm sec" id="restAdd15" aria-label="15 Sekunden länger" onclick="restAdd(15)">+15</button>
  <div id="trainBarSlot"></div>
  <button class="btn sm sec" id="restStop" onclick="restStop()">Fertig</button>
</div>
<!-- Toast-Host: genau eine sichtbare Meldung, Warteschlange in shell.js -->
<div id="toastHost" aria-live="polite"></div>
<script>window.BE_VERSION='__APP_VERSION__';</script>
<script src="/mindset.js?v=__APP_VERSION__"></script>
<script src="/js/core.js?v=__APP_VERSION__"></script>
<script src="/js/home.js?v=__APP_VERSION__"></script>
<script src="/js/training.js?v=__APP_VERSION__"></script>
<script src="/js/diet.js?v=__APP_VERSION__"></script>
<script src="/js/analysis.js?v=__APP_VERSION__"></script>
<script src="/js/coach.js?v=__APP_VERSION__"></script>
<script src="/js/account.js?v=__APP_VERSION__"></script>
<script src="/js/shell.js?v=__APP_VERSION__"></script>
</body>
</html>
