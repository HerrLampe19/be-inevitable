<script>
/* NOTAUSGANG: /?swkill=1 meldet den Service Worker ab, leert ALLE Caches und laedt die Seite sauber neu
   (siehe DEPLOY-PRUEFEN.md). Fuer den Fall, dass eine Auslieferung einen kaputten Worker hinterlaesst und
   ein normales Neuladen nicht mehr durchkommt.
   Danach laeuft dieser TAB im Notbetrieb: kein Service Worker, kein Cache – sonst installierte sich
   sofort wieder derselbe Worker, und wenn genau der das Problem ist, waere man keinen Schritt weiter.
   Der Merker liegt in sessionStorage: Tab schliessen und neu oeffnen = alles wieder normal.
   Muss VOR /app.js laufen (core.js registriert den Worker beim Laden), deshalb inline hier oben. */
(function(){
  var kill=/[?&]swkill=1/.test(location.search);
  var safe=false;try{safe=sessionStorage.getItem('be_swkill')==='1';}catch(e){}
  if(!kill&&!safe)return;
  try{Object.defineProperty(navigator.serviceWorker,'register',{configurable:true,
    value:function(){return Promise.reject(new Error('be_swkill: Notbetrieb, kein Service Worker'));}});}catch(e){}
  if(kill){
    /* Erst abmelden und neu laden – die Caches NICHT hier loeschen: dieser Seitenaufruf laeuft noch
       durch den alten Worker, und dessen fetch-Zweig legt gerade eben geholte Dateien sofort wieder ab
       (gemessen: be-shell-… stand danach wieder da). Nach dem Neuladen ist kein Worker mehr dazwischen. */
    try{sessionStorage.setItem('be_swkill','1');}catch(e){}
    var done=function(){location.replace(location.pathname);};
    try{
      ((navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
        ?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));})
        :Promise.resolve()).then(done,done);
    }catch(e){done();}
    return;
  }
  /* Notbetrieb: kein Worker mehr aktiv – jetzt koennen die Caches wirklich weg und bleiben weg. */
  console.warn('[swkill] Notbetrieb: kein Service Worker, kein Cache in diesem Tab. Tab schliessen hebt das auf.');
  try{if(window.caches&&caches.keys)caches.keys()
    .then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));})
    .catch(function(){});}catch(e){}
})();
</script>

<!-- ANMELDEKARTE – STATISCH (A-III.3, 2.7.0).
     Bis 2.6.0 entstand dieses Formular im 8. von 9 Skripten (account.js renderLoginView): wer die App

     renderLoginView() in account.js baut sie nur noch, wenn sie fehlt (Erkennungsmerkmal: #authTabLogin);

<div id="loginView" class="login">

      <button type="button" id="authTabReg" role="tab" aria-selected="false" onclick="if(typeof setAuthMode==='function')setAuthMode('register')">Registrieren</button>

    <div id="authErr" class="err hidden" role="alert"></div>
    <div id="regName" class="field hidden"><label for="i_name">Name</label><input id="i_name" name="name" autocomplete="name" placeholder="Dein Name" maxlength="80" enterkeyhint="next"></div>
    <div class="field"><label for="i_email">E-Mail</label><input id="i_email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="du@mail.com" enterkeyhint="next"></div>

    <div class="field"><label for="i_pw">Passwort</label><div class="pw-wrap"><input id="i_pw" name="password" type="password" autocomplete="current-password" placeholder="••••••••" enterkeyhint="go" oninput="if(typeof pwHint==='function')pwHint(this)" maxlength="200"><button type="button" class="pw-eye" aria-label="Passwort anzeigen" aria-pressed="false" onclick="if(typeof pwToggle==='function')pwToggle(this)"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="pw-hint hidden" id="i_pw_hint" aria-live="polite"><span class="pw-meter" aria-hidden="true"><i></i></span><span class="pw-hint-t">Mindestens 8 Zeichen, kein häufiges Passwort.</span></div></div>
    <div id="regCode" class="field hidden"><label for="i_code">Einladungscode</label><input id="i_code" name="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Code vom Betreiber" maxlength="80" enterkeyhint="go"></div>

  <!-- Rechtsseiten bewusst AUSSERHALB des Formulars und als echte Links auf statische Seiten:

<div id="appView" class="app hidden">
  <!-- Landmarken (header/nav/main): ohne sie hat ein Screenreader keinen Sprungpunkt und liest die Hülle

  <header class="hdr">
    <!-- G1/G2 (DESIGN-4 3.2): der kompakte Titel traegt IMMER dasselbe Wort wie der Reiter und wie der
         grosse Titel der Seite - nie den App-Namen. `sunk` ist der Startzustand fuer den Fall, dass
         die Seite noch keinen grossen Titel hat (oder /app.js noch nicht laeuft): dann steht der

    <div class="title"><span id="hdrTitle" class="sunk">Heute</span></div>
    <div class="acts">

      <button class="btn icon sm ghost" id="searchBtn" aria-label="Suchen" onclick="if(typeof bootCall==='function')bootCall('search','openSearch')"></button>
      <button class="bell" id="bellBtn" aria-label="Nachrichten" onclick="if(typeof bootCall==='function')bootCall('coach','openMessages')"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="badge hidden" id="bellBadge"></span></button>

    </div>
  </header>
  <div id="ctxBar" class="ctx-bar"></div>

  <!-- PUSH-EBENE (DESIGN-4 3.3). Eine echte zweite Ebene, die seitlich hereinkommt, die Reiterleiste
       STEHEN LAESST und oben einen Zurueck-Knopf mit dem Namen des ELTERNBILDSCHIRMS traegt (G3).
       Gezeichnet wird sie von pushPage()/popPage() in shell.js; leer und `hidden`, solange niemand
       tiefer gegangen ist. Sie liegt INNERHALB von #appView, damit `inert` beim Oeffnen eines Sheets
       (shell.js A11_INERT) sie automatisch mitnimmt - ein Sheet legt sich ueber alles.

<!-- Der dunkle Hintergrund ist KEIN Bedienelement: er bekommt darum weder role="button" noch tabindex.
     Tippen daneben schließt das Sheet trotzdem – der Handler hängt unten am Skript, nicht als onclick am
     Element (ein onclick ohne Rolle wäre ein Versprechen an die Tastatur, das der Hintergrund nicht hält).
     Für die Tastatur schließen Escape (shell.js) und der Schließen-Knopf im Sheet. -->
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<!-- Pausen-Timer / Trainings-Leiste über der Nav (Logik: training.js; Slot #trainBarSlot für Hantelrechner/Abschließen)

     Die typeof-Sicherung steht trotzdem davor, aus demselben Grund wie im Anmeldeformular oben:
     ein Tipp darf in keinem Zustand einen ReferenceError auslösen. -->
<div id="restBar" class="restbar hidden">

<script>window.BE_VERSION='__APP_VERSION__';
/* WARTUNGSHINWEIS (BUILD-A5 Abschnitt 4 Punkt 5, DEFER-A5 W1) – der fuenfte Laufzeit-Schalter.
   Der Betreiber setzt eine Zeile in der Verwaltung, der Server gibt sie unter GET /api/notice ohne
   Anmeldung heraus. Bis zur Fix-Runde stand sie NUR in der Verwaltung: `public/js/coach.js` wird nur
   fuer Coach und Betreiber nachgeladen (BOOT_MODULES), ein Athlet lud sie nie – gemessen 0 Treffer
   fuer "notice" in core.js/shell.js/home.js/account.js/index.html. Der Schalter erreichte damit
   genau die Gruppe nicht, fuer die er gedacht ist.
   Warum hier in der Huelle und nicht in einem der Module: die Zeile gilt ALLEN – angemeldet wie
   abgemeldet – und die Huelle ist der einzige Ort, den beide Ansichten teilen.
   WANN geholt wird, ist eine Messung, keine Laune:
     · In der App (appView sichtbar) sofort. tools/perf.mjs misst home_cold_slow4g mit 14 Anfragen
       gegen eine Grundlinie von 16 – diese eine Anfrage (rund 30 Byte) passt hinein.
     · Auf der ANMELDESEITE erst 2,5 s nach `load`. login_cold_slow4g liegt bei 9 Anfragen und die
       Grundlinie ebenfalls bei 9 – dort ist keine Anfrage frei. Der Hinweis ist kein Teil des
       Startpfads: er kommt, wenn die Seite laengst steht. Das ist bewusst so und steht auch im
       Bericht FIX-A5-A-V.3.md.
   Faellt der Abruf aus (offline, alter Server), passiert nichts – es gibt dann keine Zeile. */
(function(){
  var txt=null,geholt=false,versuche=0,iv=null;
  function ziel(){
    var a=document.getElementById('appView');
    if(a&&!a.classList.contains('hidden'))return a;
    var l=document.getElementById('loginView');
    return (l&&!l.classList.contains('hidden'))?l:null;}
  function zeichnen(){
    if(!txt)return;
    var host=ziel();if(!host)return;
    var alt=document.getElementById('opsNotice');
    if(alt){if(alt.parentNode===host)return;alt.remove();}   /* Ansicht gewechselt: mitnehmen */
    var el=document.createElement('div');
    el.id='opsNotice';el.className='note warn';el.setAttribute('role','status');
    el.style.margin='8px 16px 12px';el.textContent=txt;      /* textContent: der Text kommt vom Betreiber, nie als HTML */
    var vor=(host.id==='appView')
      ?(document.getElementById('ctxBar')||document.getElementById('views'))
      :host.querySelector('.login-card');
    if(vor&&vor.parentNode===host)host.insertBefore(el,vor);else host.appendChild(el);}
  function holen(){
    if(geholt)return;geholt=true;
    try{
      fetch('/api/notice',{credentials:'same-origin'})
        .then(function(r){return r.ok?r.json():null;})
        .then(function(d){
          var t=(d&&d.notice)?String(d.notice).slice(0,300).trim():'';
          if(!t)return;txt=t;zeichnen();})
        .catch(function(){});
    }catch(e){}}
  /* Der Wechsel Anmeldeseite -> App ist ein Klassenwechsel an #appView (kein Neuladen). Ein
     Beobachter kostet nichts und faengt ihn auch dann, wenn jemand erst nach Minuten anmeldet;
     die zwei Ticks danach fangen das Zeichnen, das unmittelbar nach dem Umschalten passiert. */
  function schauen(){
    var a=document.getElementById('appView');
    if(a&&!a.classList.contains('hidden'))holen();
    zeichnen();}
  try{
    var mo=new MutationObserver(function(){schauen();setTimeout(schauen,400);});
    ['appView','loginView'].forEach(function(id){var el=document.getElementById(id);
      if(el)mo.observe(el,{attributes:true,attributeFilter:['class']});});
  }catch(e){
    iv=setInterval(function(){schauen();if(++versuche>120){clearInterval(iv);iv=null;}},500);}
  schauen();
  function spaet(){setTimeout(function(){holen();setTimeout(zeichnen,300);},2500);}
  if(document.readyState==='complete')spaet();else window.addEventListener('load',spaet);
})();
// Tippen auf den Hintergrund schließt die oberste Sheet-Ebene – dieselbe Bedingung wie vorher als
// onclick am #modal (nur der Hintergrund selbst, nicht das Sheet darin). closeModal() kommt aus
// shell.js und ist beim ersten Tipp längst geladen.
(function(){var m=document.getElementById('modal');if(!m)return;
  m.addEventListener('click',function(e){if(e.target===m&&typeof closeModal==='function')closeModal();});})();
/* B2-Notnagel: Der Server laesst das Anmelde-Logo nur weg, wenn die Anfrage ein Sitzungs-Cookie traegt.
   Das Cookie kann tot sein (30 Tage um, Passwort woanders geaendert, Konto geloescht) – dann bleibt die
   Anmeldekarte stehen und braucht ihr Bild. Zwei Ausloeser: jemand fasst die Karte an, oder /api/me ist
   beantwortet und ME ist trotzdem leer (zweimal im Abstand von 250 ms geprueft, damit wir nicht in die
   Luecke zwischen Antwort und ME-Zuweisung eines angemeldeten Starts fallen). Steht ein `src` – der
   abgemeldete Besucher –, tut das hier gar nichts: sein Logo kommt wie immer sofort. */
(function(){var i=document.getElementById('loginLogo');if(!i||i.getAttribute('src'))return;
  var lv=document.getElementById('loginView'),n=0,t=null;
  function show(){if(i.getAttribute('src'))return;var s=i.getAttribute('data-src');if(!s)return;
    if(t){clearInterval(t);t=null;}i.style.display='';i.setAttribute('src',s);}
  /* Am document, nicht an der Karte: Reset- und Einladungslink oeffnen ein Sheet DARUEBER, und die
     beiden Wege fragen /api/me gar nicht erst – der Tipp landet dann nicht in #loginView. */
  window.beLoginLogo=show;
  ['pointerdown','focusin','keydown'].forEach(function(ev){document.addEventListener(ev,show,{once:true});});
  function meDa(){try{return performance.getEntriesByType('resource').some(function(e){return /\/api\/me(\?|$)/.test(e.name);});}catch(e){return true;}}
  function angemeldet(){try{return typeof ME!=='undefined'&&!!ME;}catch(e){return false;}}
  t=setInterval(function(){
    if(angemeldet()||(lv&&lv.classList.contains('hidden'))){clearInterval(t);t=null;return;}
    if(meDa())n++;else n=0;
    if(n>=2)show();
    },250);
  setTimeout(function(){if(t){clearInterval(t);t=null;}},30000);})();</script>
<!-- 2.7.0 (A-III.3): EIN Skript statt zehn, und mit defer – kein synchrones Skript vor dem ersten Bild.
     /app.js = core, home, training, diet, account, shell (die Reihenfolge von 2.6.0, ohne die vier
     nachgeladenen Dateien) plus der Nachlade-Lader am Ende. account.js MUSS vor shell.js stehen.
     analysis, mindset, coach und search holt bootLoad() aus /mod/<name>.js – beim Aufruf der Ansicht
     und spaetestens im Leerlauf, sobald die Startseite steht. -->
<script defer src="/app.js?v=__APP_VERSION__"></script>
</body>
